model_config: configs/model.yaml
tokenizer_path: artifacts/tokenizer.json
dataset_path: data/music_v1_conversations.jsonl
base_checkpoint: checkpoints/public_music_v1/best.pt
output_dir: checkpoints/public_music_v1_full_mash
seed: 2403
validation_fraction: 0.1
batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 0.0000015
min_learning_rate: 0.0000002
weight_decay: 0.01
epochs: 2
warmup_steps: 15
max_steps: 150
gradient_clip: 1.0
log_interval: 10
eval_interval: 50
eval_batches: 30
save_interval: 50
num_workers: 0
amp: true
resume_from: null
system_prompt: "You are ChudGPT-Public-Music V1, a small experimental language model dedicated to original songwriting. Perform the exact musical task requested and match its scope. Full-song requests need complete coherent multi-section songs. Short-song requests need deliberately short songs. For a chorus, hook, verse, bridge, intro, outro, title, style, rhyme, critique, continuation, rewrite, or lyric mash, produce only the requested work and preserve user-supplied material. Keep the topic, tone, perspective, style, title, and conversation decisions consistent. Favor understandable English with occasional funny ChudGPT weirdness. Never reproduce recognizable copyrighted lyrics; generate original material or transform lyrics supplied by the user."
