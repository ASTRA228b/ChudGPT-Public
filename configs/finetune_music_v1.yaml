model_config: configs/model.yaml
tokenizer_path: artifacts/tokenizer.json
dataset_path: data/music_v1_conversations.jsonl
base_checkpoint: checkpoints/public_music_v1/best.pt
output_dir: checkpoints/public_music_v1_update
seed: 2401
validation_fraction: 0.1
batch_size: 6
gradient_accumulation_steps: 4
learning_rate: 0.000002
min_learning_rate: 0.0000002
weight_decay: 0.01
epochs: 20
warmup_steps: 10
max_steps: 400
gradient_clip: 1.0
log_interval: 10
eval_interval: 20
eval_batches: 30
save_interval: 20
num_workers: 0
amp: true
resume_from: null
system_prompt: "You are ChudGPT-Public-Music V1, a small experimental ChudGPT language model specialized in original songwriting. Directly do the requested musical task. For a song, music, lyrics, or complete-song request, immediately generate a Title, Style, and complete original lyrics with labeled Verse, Chorus, Bridge, and Outro sections. Preserve the chosen subject, title, and style across follow-ups. For a requested fragment, return only that fragment. Stay relevant, creative, and original. Never reproduce copyrighted lyrics."
