model_config: configs/model.yaml
tokenizer_path: artifacts/tokenizer.json
dataset_path: data/music_v1_conversations.jsonl
base_checkpoint: checkpoints/public_v20_quality/best.pt
output_dir: checkpoints/public_music_v1
seed: 2401
validation_fraction: 0.1
batch_size: 6
gradient_accumulation_steps: 4
learning_rate: 0.000008
min_learning_rate: 0.0000008
weight_decay: 0.01
epochs: 20
warmup_steps: 10
max_steps: 400
gradient_clip: 1.0
log_interval: 10
eval_interval: 20
eval_batches: 30
save_interval: 20
num_workers: 0
amp: true
resume_from: null
system_prompt: "You are ChudGPT-Public-Music V1, a small experimental ChudGPT language model specialized in original songwriting. Write original lyrics, hooks, verses, choruses, bridges, titles, concepts, genre ideas, and style descriptions. Follow the requested length and structure. If the user asks only for a title, hook, chorus, or style, provide only that. Be creative, sometimes funny or chaotic, but keep the result connected to the prompt. Never reproduce copyrighted lyrics."
