name: ChudGPT Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify desktop source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify

  package:
    name: Package ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run package:win
          - name: macOS
            os: macos-latest
            command: npm run build && npx electron-builder --mac dmg zip
          - name: Linux
            os: ubuntu-latest
            command: npm run build && npx electron-builder --linux AppImage --publish never
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ChudGPT-Desktop-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ChudGPT Desktop ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## ChudGPT Desktop ${{ github.ref_name }}

            Native desktop client for ChudGPT-Public and ChudGPT-Public-Music V1.

            - Public V20 / Music V1 model-profile selector in Settings
            - Isolated Music sessions, status, welcome text, and API routing
            - Reliable composer focus for new and switched conversations
            - Safer request cancellation and stale-response handling
            - Persistent multi-chat system with isolated API sessions
            - Futuristic neon desktop interface and native window controls
            - Local chat search, rename, delete, export, and import
            - Markdown and polished code rendering
            - Adjustable chat, sidebar, composer, theme, glow, density, startup, and privacy settings
            - Performance mode, status-poll controls, and long-chat render limits
            - ChudGPT-Public status, timeout, cancellation, and offline handling
            - Separate Windows, macOS, and Linux packages

            ChudGPT-Public is experimental. Responses may be inaccurate or broken.
          files: artifacts/*
